<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f4">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span class="brand-dot">.</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/projects.html' | relative_url }}" {% if page.url == '/projects.html' %}aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/blogs.html' | relative_url }}" {% if page.url == '/blogs.html' or page.layout == 'post' %}aria-current="page"{% endif %}>Technical Blog</a>
          <a href="{{ '/knowledge_graph.html' | relative_url }}" {% if page.url == '/knowledge_graph.html' %}aria-current="page"{% endif %}>Knowledge Graph</a>
        </nav>
      </header>
      <main id="main-content">{{ content }}</main>
      <footer class="site-footer">
        <span>© {{ 'now' | date: '%Y' }} {{ site.title | escape }}</span>
        <a href="https://github.com/HuyinCP">GitHub ↗</a>
      </footer>
    </div>
    {% if page.graph %}<script src="{{ '/assets/js/knowledge-graph.js' | relative_url }}" defer></script>{% endif %}
  </body>
</html>
