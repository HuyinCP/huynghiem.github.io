---
layout: default
---
<article class="post">
  <a class="back-link" href="{{ '/blogs.html' | relative_url }}">← All posts</a>
  <header class="post-header">
    <p class="eyebrow">Article · <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="lead">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
