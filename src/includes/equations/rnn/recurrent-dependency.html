<div class="equation-block" role="math" aria-label="Recurrent gradient dependency equation">
  \[
    \frac{\partial h^{\langle t\rangle}}
         {\partial h^{\langle k\rangle}}
    = \prod_{i=k+1}^{t}
      \frac{\partial h^{\langle i\rangle}}
           {\partial h^{\langle i-1\rangle}}
  \]
