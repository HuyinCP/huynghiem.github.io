<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ description }}">
  <title>{{ title }} · Huy</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/mathjax-config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <nav class="nav wrap" aria-label="Main navigation">
    <a href="../index.html">Home</a>
    <a href="../projects.html">Projects</a>
    <a href="../blogs.html">Technical Blog</a>
    <a href="../knowledge_graph.html">Knowledge Graph</a>
  </nav>

  <main class="wrap" id="main-content">
    <article class="article">
      <p class="article-back"><a href="{{ back_url }}">← {{ back_label }}</a></p>

      <header class="article-header">
        <h1>{{ title }}</h1>
        <p class="article-lead">{{ lead }}</p>
        <p class="listing-date">{{ date }}</p>
      </header>

      {{ content }}
    </article>
  </main>
</body>
</html>
